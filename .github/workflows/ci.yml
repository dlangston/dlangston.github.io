name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Verify built entry is compiled asset
        run: |
          if grep -Eq 'src/.+\.jsx' dist/index.html; then
            echo "Build output references source JSX entry. Expected compiled asset in dist/index.html."
            cat dist/index.html
            exit 1
          fi
